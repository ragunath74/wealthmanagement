version: "3.8"

# Local development/demo infrastructure ONLY -- MySQL, Redis and Kafka. The
# four services (account-service, tax-engine-service, drift-engine-service,
# execution-gateway-service) are run directly via `mvnw spring-boot:run` in
# separate terminals (see RUNBOOK.md) rather than containerized here, so their
# logs are easy to watch individually while you're learning the system.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ./sql/full-schema.sql:/docker-entrypoint-initdb.d/full-schema.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Deliberately off: every topic is created explicitly by kafka/create-topics.sh (or .ps1)
      # with a partition count someone actually chose -- see that script's comments.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
